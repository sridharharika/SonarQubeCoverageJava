name: workflow to build and reviw the code using sonarqube
on: push
jobs:
  job_maven:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code on the runner vm.
        uses: actions/checkout@v7
      - name: install java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'  
      - name: build and review the code using maven
        run: mvn clean install
  job_sonar:
    runs-on: ubuntu-latest
    needs: job_maven
    steps:
      - name: checkout the code on the runner vm.
        uses: actions/checkout@v7
      - name: install java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'  
      - name: code coverage using sonarqube
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=sridharharika_sridharharika-sonarqube -Dsonar.organization=sridharharika -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
